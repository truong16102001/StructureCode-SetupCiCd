trigger:
  branches:
    include:
      - staging

pool:
  vmImage: 'windows-latest'

variables:
- group: DemoCICD-STAG-Secrets

- name: buildConfiguration
  value: 'Release'

- name: solution
  value: 'DemoCICD/DemoCICD.sln'
  
- name: apiProject
  value: 'DemoCICD/src/DemoCICD.API/DemoCICD.API.csproj'
  
- name: persistenceProject
  value: 'DemoCICD/src/DemoCICD.Persistence/DemoCICD.Persistence.csproj'
  
- name: publishDirectory
  value: '$(Build.ArtifactStagingDirectory)/publish'
  
- name: packagePath
  value: '$(Build.ArtifactStagingDirectory)/democicd-stag.zip'
  
- name: migrationBundle
  value: '$(Build.ArtifactStagingDirectory)/efbundle.exe'
  
- name: azureServiceConnection
  value: 'azure-democicd-stag'

- name: azureWebAppName
  value: 'democicd-stag-truongnd'

steps:

- checkout: self
  displayName: 'Checkout source'

- task: UseDotNet@2
  displayName: 'Setup .NET 8'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Unit Test'
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-build'
    
- powershell: |
    dotnet tool install --global dotnet-ef --version 8.*
    dotnet ef migrations bundle `
      --project "$(persistenceProject)" `
      --startup-project "$(apiProject)" `
      --configuration $(buildConfiguration) `
      --output "$(migrationBundle)" `
      --force
  displayName: 'Build EF Migration Bundle'

- powershell: |
    & "$(migrationBundle)" --connection "$(STAGING_DB_CONNECTION_STRING)"
  displayName: 'Run Database Migration'

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(apiProject)'
    arguments: '--configuration $(buildConfiguration) --output $(publishDirectory)'
    zipAfterPublish: false
    modifyOutputPath: false

- task: ArchiveFiles@2
  displayName: 'Package application'
  inputs:
    rootFolderOrFile: '$(publishDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(packagePath)'
    replaceExistingArchive: true

- task: AzureWebApp@1
  displayName: 'Deploy Azure App Service'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'webApp'
    appName: '$(azureWebAppName)'
    package: '$(packagePath)'
    deploymentMethod: 'auto'